<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">Операції зі стеком</title>
  <desc id="description">Покрокове додавання чисел 1 і 2 до стека та вилучення верхнього числа 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .caption { font: 700 20px Arial, sans-serif; fill: #172033; }
      .label { font: 500 17px Arial, sans-serif; fill: #475569; }
      .number { font: 700 31px Arial, sans-serif; fill: #fff; }
      .small { font: 600 15px Arial, sans-serif; fill: #1677be; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1280" height="430" fill="#fff"/>
  <text class="title" x="40" y="48">Стек: додавання та вилучення елементів</text>
  <text class="subtitle" x="40" y="78">Усі операції виконуються з одного боку — з вершини стека.</text>

  <!-- Крок 1: порожній стек -->
  <text class="small" x="110" y="116">КРОК 1</text>
  <path d="M70 145 V328 H250 V145" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <text class="label" x="160" y="238" text-anchor="middle">порожньо</text>
  <text class="caption" x="160" y="378" text-anchor="middle">Порожній стек</text>

  <!-- Стрілка до наступного стану -->
  <path d="M270 230 H327" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Крок 2: Push(1) -->
  <text class="small" x="412" y="116">КРОК 2</text>
  <path d="M365 145 V328 H545 V145" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="385" y="258" width="140" height="58" rx="4" fill="#2797d2"/>
  <text class="number" x="455" y="298" text-anchor="middle">1</text>
  <path d="M455 130 C455 158 455 190 455 242" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="caption" x="455" y="378" text-anchor="middle">Push(1)</text>
  <text class="label" x="455" y="405" text-anchor="middle">додати 1 на вершину</text>

  <!-- Стрілка до наступного стану -->
  <path d="M565 230 H622" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Крок 3: Push(2) -->
  <text class="small" x="707" y="116">КРОК 3</text>
  <path d="M660 145 V328 H840 V145" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="680" y="258" width="140" height="58" rx="4" fill="#2797d2"/>
  <text class="number" x="750" y="298" text-anchor="middle">1</text>
  <rect x="680" y="192" width="140" height="58" rx="4" fill="#2797d2"/>
  <text class="number" x="750" y="232" text-anchor="middle">2</text>
  <path d="M750 130 C750 151 750 162 750 176" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="caption" x="750" y="378" text-anchor="middle">Push(2)</text>
  <text class="label" x="750" y="405" text-anchor="middle">додати 2 на вершину</text>

  <!-- Стрілка до наступного стану -->
  <path d="M860 230 H917" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Крок 4: Pop() -->
  <text class="small" x="1002" y="116">КРОК 4</text>
  <path d="M955 145 V328 H1135 V145" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="975" y="258" width="140" height="58" rx="4" fill="#2797d2"/>
  <text class="number" x="1045" y="298" text-anchor="middle">1</text>
  <rect x="976" y="124" width="138" height="58" rx="4" fill="#2797d2"/>
  <text class="number" x="1045" y="164" text-anchor="middle">2</text>
  <path d="M1045 242 C1045 215 1045 197 1045 189" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="caption" x="1045" y="378" text-anchor="middle">Pop()</text>
  <text class="label" x="1045" y="405" text-anchor="middle">вилучити 2 з вершини</text>
</svg>
