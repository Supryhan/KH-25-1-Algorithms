<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" role="img" aria-labelledby="title description">
  <title id="title">Операції з чергою</title>
  <desc id="description">Елемент 7 додається в кінець черги, а елемент 1 вилучається з її початку.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1677be"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
      .end { font: 700 19px Arial, sans-serif; fill: #1677be; }
      .action { font: 700 20px Arial, sans-serif; fill: #b54747; }
      .note { font: 500 17px Arial, sans-serif; fill: #475569; }
      .number { font: 700 32px Arial, sans-serif; fill: #fff; }
    </style>
  </defs>

  <rect width="1280" height="430" fill="#fff"/>
  <text class="title" x="40" y="48">Черга: додавання та вилучення елементів</text>
  <text class="subtitle" x="40" y="78">Нові елементи додаються в кінець, а перший елемент вилучається з початку.</text>

  <text class="end" x="315" y="166" text-anchor="middle">КІНЕЦЬ ЧЕРГИ</text>
  <path d="M315 176 V194" fill="none" stroke="#1677be" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text class="end" x="915" y="166" text-anchor="middle">ПОЧАТОК ЧЕРГИ</text>
  <path d="M915 176 V194" fill="none" stroke="#1677be" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Власне черга -->
  <g stroke="#fff" stroke-width="3">
    <rect x="255" y="200" width="120" height="82" fill="#2797d2"/>
    <rect x="375" y="200" width="120" height="82" fill="#2797d2"/>
    <rect x="495" y="200" width="120" height="82" fill="#2797d2"/>
    <rect x="615" y="200" width="120" height="82" fill="#2797d2"/>
    <rect x="735" y="200" width="120" height="82" fill="#2797d2"/>
  </g>
  <text class="number" x="315" y="253" text-anchor="middle">6</text>
  <text class="number" x="435" y="253" text-anchor="middle">5</text>
  <text class="number" x="555" y="253" text-anchor="middle">4</text>
  <text class="number" x="675" y="253" text-anchor="middle">3</text>
  <text class="number" x="795" y="253" text-anchor="middle">2</text>

  <!-- Додавання 7 у кінець -->
  <rect x="82" y="128" width="88" height="62" rx="4" fill="#2797d2"/>
  <text class="number" x="126" y="170" text-anchor="middle">7</text>
  <path d="M170 159 C205 159 205 240 243 240" fill="none" stroke="#1677be" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="action" x="82" y="326">Додати в чергу</text>
  <text class="note" x="82" y="354">7 додається в кінець</text>

  <!-- Вилучення 1 з початку -->
  <rect x="1082" y="295" width="88" height="62" rx="4" fill="#2797d2"/>
  <text class="number" x="1126" y="337" text-anchor="middle">1</text>
  <path d="M867 241 C968 241 973 326 1070 326" fill="none" stroke="#1677be" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="action" x="930" y="198">Вилучити з черги</text>
  <text class="note" x="930" y="224">1 вилучається з початку</text>
</svg>
