<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Швидке об'єднання Quick Union</title><desc id="d">Quick Union зберігає батьків кожного вузла в лісі дерев. Об'єднання з'єднує корені дерев.</desc>
<defs><marker id="up" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L12 6 0 12z" fill="#64748b"/></marker><marker id="red" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7 0 14z" fill="#b91c1c"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.node{fill:#fff;stroke:#334155;stroke-width:3}.selected{fill:#1d4f91;stroke:#163b6d;stroke-width:3}.n{font-size:28px;text-anchor:middle;dominant-baseline:middle}.caption{font-size:27px}.head{font-size:35px;font-weight:700}.link{stroke:#64748b;stroke-width:6;fill:none;marker-end:url(#up)}.array{stroke:#1e293b;stroke-width:2}.idx{font-size:19px;text-anchor:middle}.val{font-size:26px;text-anchor:middle;dominant-baseline:middle}</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="800" y="85" font-size="58" font-weight="700" text-anchor="middle">Швидке об'єднання <tspan fill="#475569">(Quick Union)</tspan></text><text x="90" y="170" font-size="31">Кожен вузол має батьківський вузол — так утворюється ліс дерев.</text>
<text x="100" y="250" class="head">Пошук</text><text x="100" y="300" class="caption">перевірити, чи p і q мають один корінь</text><text x="850" y="250" class="head">Об'єдна</text><text x="850" y="300" class="caption">зробити корінь p дочірнім вузлом кореня q</text>
