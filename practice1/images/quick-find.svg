<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Швидкий пошук Quick Find</title><desc id="d">Quick Find: компоненти позначені значеннями масиву id; union(2, 5) змінює всі значення ідентифікатора компоненти.</desc>
<defs><marker id="a" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7 0 14z" fill="#b45309"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.bullet{font-size:29px}.head{font-size:34px;font-weight:700}.edge{stroke:#475569;stroke-width:5}.node{fill:#fff;stroke:#334155;stroke-width:3}.num{font-size:26px;text-anchor:middle;dominant-baseline:middle}.arr{stroke:#1e293b;stroke-width:2}.idx{font-size:20px;text-anchor:middle}.val{font-size:28px;text-anchor:middle;dominant-baseline:middle;font-weight:700}</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="800" y="85" font-size="58" font-weight="700" text-anchor="middle">Швидкий пошук <tspan fill="#475569">(Quick Find)</tspan></text><circle cx="94" cy="164" r="8" fill="#0f172a"/><text x="120" y="175" class="bullet">Кожному вузлу відповідає число — ідентифікатор його зв'язаної компоненти.</text><circle cx="94" cy="245" r="8" fill="#0f172a"/><text x="120" y="255" class="bullet"><tspan font-weight="700">Пошук:</tspan> перевірити, чи p і q мають однаковий id.</text><circle cx="94" cy="305" r="8" fill="#0f172a"/><text x="120" y="315" class="bullet"><tspan font-weight="700">Обʼєднання:</tspan> замінити всі id[p] на id[q].</text>
<!-- left graph --> <text x="350" y="385" class="head" text-anchor="middle">До union(2, 5)</text><g class="edge"><path d="M105 575L245 455"/><path d="M105 575H245"/><path d="M445 455H585"/><path d="M445 455V575"/><path d="M445 575L585 455"/><path d="M585 455V575"/></g><g class="node"><circle cx="105" cy="425" r="30"/><circle cx="245" cy="455" r="30"/><circle cx="105" cy="575" r="30"/><circle cx="245" cy="575" r="30"/><circle cx="445" cy="455" r="30"/><circle cx="585" cy="455" r="30"/><circle cx="445" cy="575" r="30"/><circle cx="585" cy="575" r="30"/></g><g class="num"><text x="105" y="425">0</text><text x="245" y="455">1</text><text x="105" y="575">4</text><text x="245" y="575">5</text><text x="445" y="455">2</text><text x="585" y="455">3</text><text x="445" y="575">6</text><text x="585" y="575">7</text></g>
<!-- center arrow --> <path d="M690 525H850" fill="none" stroke="#b45309" stroke-width="12" marker-end="url(#a)"/><text x="770" y="485" class="head" fill="#92400e" text-anchor="middle">union(2, 5)</text>
<!-- right graph --> <text x="1200" y="385" class="head" text-anchor="middle">Після union(2, 5)</text><g class="edge"><path d="M945 575L1085 455"/><path d="M945 575H1085"/><path d="M1285 455H1425"/><path d="M1285 455V575"/><path d="M1285 575L1425 455"/><path d="M1425 455V575"/><path d="M1085 575L1285 455"/></g><g class="node"><circle cx="945" cy="425" r="30"/><circle cx="1085" cy="455" r="30"/><circle cx="945" cy="575" r="30"/><circle cx="1085" cy="575" r="30"/><circle cx="1285" cy="455" r="30"/><circle cx="1425" cy="455" r="30"/><circle cx="1285" cy="575" r="30"/><circle cx="1425" cy="575" r="30"/></g><g class="num"><text x="945" y="425">0</text><text x="1085" y="455">1</text><text x="945" y="575">4</text><text x="1085" y="575">5</text><text x="1285" y="455">2</text><text x="1425" y="455">3</text><text x="1285" y="575">6</text><text x="1425" y="575">7</text></g>
