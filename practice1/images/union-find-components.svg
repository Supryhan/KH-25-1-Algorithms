<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Об'єднання зв'язаних компонент</title><desc id="d">До і після union(2, 5): три зв'язані компоненти перетворюються на дві.</desc>
<defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7 0 14z" fill="#b45309"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.edge{stroke:#475569;stroke-width:6}.node{fill:#fff;stroke:#334155;stroke-width:4}.n{font-size:32px;text-anchor:middle;dominant-baseline:middle}.label{font-size:32px;font-weight:700;text-anchor:middle}.small{font-size:28px;text-anchor:middle}</style></defs>
<rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="95" font-size="52" font-weight="700" text-anchor="middle">Об'єднання компонент: union(2, 5)</text><text x="800" y="145" font-size="27" fill="#475569" text-anchor="middle">Операція додає зв'язок між двома компонентами</text>
<!-- before -->
<text x="360" y="220" class="label" fill="#475569">До об'єднання</text><g class="edge"><path d="M105 400L235 280"/><path d="M105 400H235"/><path d="M435 280H575"/><path d="M435 280V400"/><path d="M435 400L575 280"/><path d="M575 280V400"/></g><g class="node"><circle cx="105" cy="250" r="35"/><circle cx="235" cy="280" r="35"/><circle cx="105" cy="400" r="35"/><circle cx="235" cy="400" r="35"/><circle cx="435" cy="280" r="35"/><circle cx="575" cy="280" r="35"/><circle cx="435" cy="400" r="35"/><circle cx="575" cy="400" r="35"/></g><g class="n"><text x="105" y="250">0</text><text x="235" y="280">1</text><text x="105" y="400">4</text><text x="235" y="400">5</text><text x="435" y="280">2</text><text x="575" y="280">3</text><text x="435" y="400">6</text><text x="575" y="400">7</text></g>
<!-- arrow --> <path d="M690 340H850" fill="none" stroke="#b45309" stroke-width="12" marker-end="url(#arrow)"/><text x="770" y="300" class="label" fill="#92400e">union(2, 5)</text>
<!-- after -->
<text x="1200" y="220" class="label" fill="#475569">Після об'єднання</text><g class="edge"><path d="M945 400L1075 280"/><path d="M945 400H1075"/><path d="M1275 280H1415"/><path d="M1275 280V400"/><path d="M1275 400L1415 280"/><path d="M1415 280V400"/><path d="M1075 400L1275 280"/></g><g class="node"><circle cx="945" cy="250" r="35"/><circle cx="1075" cy="280" r="35"/><circle cx="945" cy="400" r="35"/><circle cx="1075" cy="400" r="35"/><circle cx="1275" cy="280" r="35"/><circle cx="1415" cy="280" r="35"/><circle cx="1275" cy="400" r="35"/><circle cx="1415" cy="400" r="35"/></g><g class="n"><text x="945" y="250">0</text><text x="1075" y="280">1</text><text x="945" y="400">4</text><text x="1075" y="400">5</text><text x="1275" y="280">2</text><text x="1415" y="280">3</text><text x="1275" y="400">6</text><text x="1415" y="400">7</text></g>
<g fill="#fff" stroke="#cbd5e1" stroke-width="3"><rect x="70" y="570" width="580" height="170" rx="20"/><rect x="925" y="570" width="600" height="170" rx="20"/></g><text x="360" y="635" class="small">{ 0 }   { 1, 4, 5 }   { 2, 3, 6, 7 }</text><text x="360" y="700" class="label" fill="#92400e">3 зв'язані компоненти</text><text x="1225" y="635" class="small">{ 0 }   { 1, 2, 3, 4, 5, 6, 7 }</text><text x="1225" y="700" class="label" fill="#166534">2 зв'язані компоненти</text><rect x="210" y="790" width="1180" height="60" rx="14" fill="#eff6ff"/><text x="800" y="830" font-size="27" text-anchor="middle" fill="#1e3a8a">Компонента — це множина вузлів, між якими існують шляхи.</text>
</svg>
